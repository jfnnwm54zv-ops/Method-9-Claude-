function degreesToCompass(deg) {
  if (deg === null || deg === undefined || isNaN(deg)) return "";
  const dirs16 = ["N", "NNE", "NE", "ENE", "E", "ESE", "SE", "SSE", "S", "SSW", "SW", "WSW", "W", "NNW", "NW", "N"];
  const idx = Math.round(deg / 22.5) % 16;
  return dirs16[idx] || "";
}

function parseLeadingNumber(str) {
  if (str === null || str === undefined || str === "") return null;
  const m = String(str).match(/-?\d+(\.\d+)?/);
  return m ? parseFloat(m[0]) : null;
}

function getDayOfYear(date) {
  const start = new Date(date.getFullYear(), 0, 0);
  return Math.floor((date - start) / 86400000);
}

// Standard solar-position equations (declination + hour-angle method used in
// solar-energy engineering); accurate to roughly a degree, which is plenty
// for a sun-behind-observer sector check.
function computeSunAzimuth(date, lat, lon) {
  const rad = Math.PI / 180;
  const n = getDayOfYear(date);
  const dec = 23.45 * Math.sin(rad * ((360 / 365) * (284 + n)));
  const B = rad * ((360 / 365) * (n - 81));
  const eot = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);

  const tzOffsetHours = -date.getTimezoneOffset() / 60;
  const lstm = 15 * tzOffsetHours;
  const tc = 4 * (lon - lstm) + eot;
  const localHours = date.getHours() + date.getMinutes() / 60 + date.getSeconds() / 3600;
  const lst = localHours + tc / 60;
  const hra = 15 * (lst - 12);

  const latRad = rad * lat;
  const decRad = rad * dec;
  const hraRad = rad * hra;

  const sinAlt = Math.sin(decRad) * Math.sin(latRad) + Math.cos(decRad) * Math.cos(latRad) * Math.cos(hraRad);
  const alt = Math.asin(Math.max(-1, Math.min(1, sinAlt)));

  let cosAz = (Math.sin(decRad) - Math.sin(alt) * Math.sin(latRad)) / (Math.cos(alt) * Math.cos(latRad));
  cosAz = Math.max(-1, Math.min(1, cosAz));
  let az = Math.acos(cosAz) / rad;
  if (hra > 0) az = 360 - az;

  return { azimuthDeg: az, altitudeDeg: alt / rad };
}

// Great-circle distance between two lat/lon points, in feet (Haversine formula).
function haversineDistanceFt(lat1, lon1, lat2, lon2) {
  const R_FT = 20925646.325; // Earth's mean radius in feet
  const toRad = (d) => (d * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R_FT * c;
}

// Initial compass bearing (0-360°) from point 1 to point 2.
function initialBearingDeg(lat1, lon1, lat2, lon2) {
  const toRad = (d) => (d * Math.PI) / 180;
  const toDeg = (r) => (r * 180) / Math.PI;
  const y = Math.sin(toRad(lon2 - lon1)) * Math.cos(toRad(lat2));
  const x =
    Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
    Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(toRad(lon2 - lon1));
  const brng = toDeg(Math.atan2(y, x));
  return (brng + 360) % 360;
}

function drawArrowOnCanvas(ctx, from, to, color, label) {
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(from.x, from.y);
  ctx.lineTo(to.x, to.y);
  ctx.stroke();
  const angle = Math.atan2(to.y - from.y, to.x - from.x);
  const headLen = 10;
  ctx.beginPath();
  ctx.moveTo(to.x, to.y);
  ctx.lineTo(to.x - headLen * Math.cos(angle - Math.PI / 6), to.y - headLen * Math.sin(angle - Math.PI / 6));
  ctx.lineTo(to.x - headLen * Math.cos(angle + Math.PI / 6), to.y - headLen * Math.sin(angle + Math.PI / 6));
  ctx.closePath();
  ctx.fill();
  if (label) {
    ctx.font = "11px sans-serif";
    ctx.fillText(label, to.x + 4, to.y - 4);
  }
}

function drawSunIcon(ctx, pos, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(pos.x, pos.y, 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 8; i++) {
    const a = i * (Math.PI / 4);
    const r1 = 9;
    const r2 = 13;
    ctx.beginPath();
    ctx.moveTo(pos.x + r1 * Math.cos(a), pos.y + r1 * Math.sin(a));
    ctx.lineTo(pos.x + r2 * Math.cos(a), pos.y + r2 * Math.sin(a));
    ctx.stroke();
  }
}

// ---------- tap-and-place sketch icons ----------
function drawStackIconAt(ctx, x, y) {
  ctx.strokeStyle = "#1e293b";
  ctx.fillStyle = "#1e293b";
  ctx.lineWidth = 1.5;
  ctx.strokeRect(x - 4, y - 2, 8, 16);
  ctx.beginPath();
  ctx.moveTo(x, y - 2);
  ctx.quadraticCurveTo(x - 10, y - 16, x - 3, y - 26);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x + 2, y - 2);
  ctx.quadraticCurveTo(x + 12, y - 14, x + 5, y - 24);
  ctx.stroke();
  ctx.font = "10px sans-serif";
  ctx.fillText("Stack", x + 10, y + 8);
}

function drawSunIconAt(ctx, x, y) {

  ctx.font = "10px sans-serif";
  ctx.fillStyle = "#92400e";
  ctx.fillText("Sun", x + 15, y + 4);
}

function drawWindIconAt(ctx, x, y, directionDeg) {
  const len = 18;
  const rad = (directionDeg * Math.PI) / 180;
  const dx = len * Math.sin(rad);
  const dy = -len * Math.cos(rad);
  drawArrowOnCanvas(ctx, { x: x - dx / 2, y: y - dy / 2 }, { x: x + dx / 2, y: y + dy / 2 }, "#2563eb", null);
  ctx.font = "10px sans-serif";
  ctx.fillStyle = "#2563eb";
  ctx.fillText("Wind", x + 12, y + 4);
}

function drawSketchTemplate(ctx, w, h) {
  const guide = "#94a3b8"; // slate-400, light so it reads as a guide, not user ink
  ctx.strokeStyle = guide;
  ctx.fillStyle = guide;
  ctx.lineWidth = 1.25;
  ctx.font = "11px sans-serif";
  ctx.setLineDash([]);

  const mainW = w * 0.66;
  const sideX = mainW + 14;
  const sideW = w - sideX - 8;

  // observation point + vertical sightline down to observer's position
  const obsPointX = mainW * 0.4;
  const topY = 18;
  const observerY = h * 0.4;
  ctx.beginPath();
  ctx.moveTo(obsPointX, topY + 8);
  ctx.lineTo(obsPointX, observerY);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(obsPointX - 4, topY);
  ctx.lineTo(obsPointX + 4, topY + 8);
  ctx.moveTo(obsPointX + 4, topY);
  ctx.lineTo(obsPointX - 4, topY + 8);
  ctx.stroke();
  ctx.fillText("Observation Point", obsPointX + 8, topY + 8);

  ctx.beginPath();
  ctx.arc(obsPointX, observerY, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillText("Observer's Position", obsPointX + 8, observerY + 4);

  // 140\u00b0 sector down to the sun location line
  const bottomY = h - 60;
  const halfSpread = mainW * 0.38;
  const leftX = obsPointX - halfSpread;
  const rightX = obsPointX + halfSpread;
  ctx.beginPath();
  ctx.moveTo(obsPointX, observerY);
  ctx.lineTo(leftX, bottomY);
  ctx.moveTo(obsPointX, observerY);
  ctx.lineTo(rightX, bottomY);
  ctx.stroke();
  ctx.setLineDash([3, 3]);
  ctx.beginPath();
  ctx.moveTo(leftX, bottomY);
  ctx.lineTo(rightX, bottomY);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillText("Sun Location Line", obsPointX - 44, bottomY + 14);
  ctx.fillText("140\u00b0", obsPointX - 12, observerY + 20);

  // north-arrow reference circle
  const circleX = sideX + 26;
  const circleY = 32;
  ctx.fillText("Draw North Arrow", sideX, 6);
  ctx.beginPath();
  ctx.arc(circleX, circleY, 22, 0, Math.PI * 2);
  ctx.stroke();

  // side view box with two FT dimension lines
  const svY = 76;
  const svH = 92;
  ctx.strokeRect(sideX, svY, sideW, svH);
  ctx.fillText("Side View", sideX + sideW / 2 - 22, svY + svH + 12);
  drawDoubleArrowGuide(ctx, sideX + 10, svY + 26, sideX + sideW - 26, svY + 26, guide);
  ctx.fillText("FT", sideX + sideW - 22, svY + 30);
  drawDoubleArrowGuide(ctx, sideX + 10, svY + 64, sideX + sideW - 26, svY + 64, guide);
  ctx.fillText("FT", sideX + sideW - 22, svY + 68);

  // legend key: stack w/ plume, sun, wind
  let legendY = svY + svH + 30;
  ctx.strokeRect(sideX, legendY - 9, 6, 14);
  ctx.fillText("Stack w/ Plume", sideX + 20, legendY + 4);
  legendY += 24;
  ctx.beginPath();
  ctx.arc(sideX + 3, legendY, 5, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(sideX + 3 - 7, legendY);
  ctx.lineTo(sideX + 3 + 7, legendY);
  ctx.moveTo(sideX + 3, legendY - 7);
  ctx.lineTo(sideX + 3, legendY + 7);
  ctx.stroke();
  ctx.fillText("Sun", sideX + 20, legendY + 4);
  legendY += 24;
  drawArrowOnCanvas(ctx, { x: sideX - 2, y: legendY }, { x: sideX + 16, y: legendY }, guide, null);
  ctx.fillStyle = guide;
  ctx.fillText("Wind", sideX + 20, legendY + 4);
}

function drawDoubleArrowGuide(ctx, x1, y1, x2, y2, color) {
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  [[x1, x2 > x1 ? 1 : -1], [x2, x1 > x2 ? 1 : -1]].forEach(([x, dir]) => {
    ctx.beginPath();
    ctx.moveTo(x, y1);
    ctx.lineTo(x + 5 * dir, y1 - 3);
    ctx.lineTo(x + 5 * dir, y1 + 3);
    ctx.closePath();
    ctx.fill();
  });
}

const LOCAL_STORAGE_PREFIX = "method9:";
async function storageGet(key) {
  try {
    return window.localStorage.getItem(LOCAL_STORAGE_PREFIX + key);
  } catch (e) {
    return null;
  }
}
async function storageSet(key, value) {
  try {
    window.localStorage.setItem(LOCAL_STORAGE_PREFIX + key, value);
    return true;
  } catch (e) {
    return false;
  }
}

// ---------- small field components ----------
// Defined here at module scope (not inside Method9App) so React treats them as
// the same component across renders. Defining them inside the component body
// would make React remount the underlying <input> on every keystroke — which
// is exactly what was dismissing the keyboard while typing.
function Field({ label, wide, children }) {
  return (
    <div className={`flex flex-col ${wide ? "col-span-2" : ""}`}>
      <label className="text-xs font-semibold uppercase tracking-wide text-slate-500 mb-0.5">
        {label}
      </label>
      {children}
    </div>
  );
}

function Text({ value, onChange, placeholder }) {
  return (
    <input
      type="text"
      value={value}
      placeholder={placeholder}
      onChange={(e) => onChange(e.target.value)}
      className="border border-slate-300 rounded px-2 py-2 sm:py-1.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-amber-400 focus:border-amber-400 w-full"
    />
  );
}

function StartEnd({ label, startKey, endKey, unit, header, updateHeader }) {
  return (
    <Field label={`${label}${unit ? ` (${unit})` : ""}`} wide>
      <div className="flex flex-col sm:flex-row gap-2">
        <div className="flex-1 flex items-center gap-2">
          <span className="text-xs text-slate-400 shrink-0 w-10">Start</span>
          <Text value={header[startKey]} onChange={(v) => updateHeader(startKey, v)} />
        </div>
        <div className="flex-1 flex items-center gap-2">
          <span className="text-xs text-slate-400 shrink-0 w-10">End</span>
          <Text value={header[endKey]} onChange={(v) => updateHeader(endKey, v)} />
        </div>
      </div>
    </Field>
  );
}

  const [sessionId, setSessionId] = useState(null);
  const [sessionLabel, setSessionLabel] = useState("");
  const [savedList, setSavedList] = useState([]);
  const [showLoadPanel, setShowLoadPanel] = useState(false);
  const [status, setStatus] = useState("Not saved yet");
  const [restoredDraft, setRestoredDraft] = useState(false);
  const [dirty, setDirty] = useState(false);

  const [weatherState, setWeatherState] = useState({

    end: { loading: false, error: "", fetchedAt: null, summary: "", coords: null },

  const [running, setRunning] = useState(false);
  const [elapsedSeconds, setElapsedSeconds] = useState(0);
  const [soundOn, setSoundOn] = useState(true);
  const startTimeRef = useRef(null);
  const accumulatedRef = useRef(0);
  const audioCtxRef = useRef(null);
  const lastBeepIndexRef = useRef(-1);
  const rowRefs = useRef([]);

  // ---------- source layout sketch (tap-and-place icons) ----------
  const canvasRef = useRef(null);
  const [sketchItems, setSketchItems] = useState([]);
  const [activeSketchTool, setActiveSketchTool] = useState(null); // "stack" | "sun" | "wind" | null

  // ---------- distance & angle helper ----------
  const [heightInput, setHeightInput] = useState("");
  const [angleInput, setAngleInput] = useState("");
  const [knownDistanceInput, setKnownDistanceInput] = useState("");
  const [emissionLat, setEmissionLat] = useState("");
  const [emissionLng, setEmissionLng] = useState("");
  const [showMap, setShowMap] = useState(false);
  const [mapStatus, setMapStatus] = useState("idle"); // idle | loading | ready | error
  const [mapErrorMsg, setMapErrorMsg] = useState("");
  const mapContainerRef = useRef(null);
  const leafletMapRef = useRef(null);
  const youMarkerRef = useRef(null);
  const pinMarkerRef = useRef(null);
  const [sensorStatus, setSensorStatus] = useState("idle"); // idle | requesting | active | denied | unsupported
  const [liveBeta, setLiveBeta] = useState(null);
  const [zeroBeta, setZeroBeta] = useState(null);
  const orientationListenerRef = useRef(null);
  const [cameraStatus, setCameraStatus] = useState("idle"); // idle | requesting | active | denied | error
  const [cameraError, setCameraError] = useState("");
  const videoRef = useRef(null);
  const cameraStreamRef = useRef(null);

  const stateRef = useRef();
  stateRef.current = { header, duration, rows, comments, opacityLimit, sessionId, sessionLabel, sketchItems };

  // ---------- load draft + index on mount ----------
  useEffect(() => {
    (async () => {
      const draftRaw = await storageGet(DRAFT_KEY);
      if (draftRaw) {
        try {
          const d = JSON.parse(draftRaw);
          setHeader({ ...emptyHeader, ...d.header });
          setDuration(d.duration || 30);
          setRows(d.rows && d.rows.length ? d.rows : makeBlankRows(d.duration || 30));
          setComments(d.comments && d.comments.length ? d.comments : makeBlankComments(d.duration || 30));
          setOpacityLimit(d.opacityLimit ?? "20");
          setSessionId(d.sessionId ?? null);
          setSessionLabel(d.sessionLabel ?? "");
          setSketchItems(Array.isArray(d.sketchItems) ? d.sketchItems : []);
          setStatus("Restored unsaved work from last session");
          setRestoredDraft(true);
        } catch (e) {
          /* ignore corrupt draft */
        }
      } else {
        // No unsaved work to restore — still worth pre-filling the site identity
        // fields (company/facility/address) from whatever was last used, so a
        // brand-new reading doesn't start from a completely blank form.
        const siteRaw = await storageGet(SITE_IDENTITY_KEY);
        if (siteRaw) {
          try {
            const site = JSON.parse(siteRaw);
            setHeader((h) => ({ ...h, ...site }));
          } catch (e) {
            /* ignore corrupt site identity */
          }
        }
      }
      const idxRaw = await storageGet(INDEX_KEY);
      if (idxRaw) {
        try {
          setSavedList(JSON.parse(idxRaw));
        } catch (e) {}
      }
    })();
  }, []);

  // ---------- stopwatch ticking ----------
  useEffect(() => {
    if (!running) return;
    const interval = setInterval(() => {
      const now = Date.now();
      const elapsedMs = accumulatedRef.current + (now - (startTimeRef.current ?? now));
      setElapsedSeconds(Math.floor(elapsedMs / 1000));
    }, 200);
    return () => clearInterval(interval);
  }, [running]);

  const playBeep = useCallback(() => {
    try {
      if (!audioCtxRef.current) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        audioCtxRef.current = new Ctx();
      }
      const ctx = audioCtxRef.current;
      if (ctx.state === "suspended") ctx.resume();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.18);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.2);
    } catch (e) {
      /* audio not available; ignore */
    }
  }, []);

  // beep at every 15-second mark while running, and auto-stop at the end of the reading period
  useEffect(() => {
    const idx = Math.floor(elapsedSeconds / 15);
    if (running && idx !== lastBeepIndexRef.current) {
      lastBeepIndexRef.current = idx;
      if (idx > 0 && soundOn) playBeep();
    }
    if (running && elapsedSeconds >= duration * 60) {
      setRunning(false);
      accumulatedRef.current = duration * 60 * 1000;
      setStatus(`Stopwatch reached ${duration} minutes — observation period complete`);
      setHeader((h) => ({ ...h, endTime: h.endTime || nowTimeStr() }));
      markDirty();
    }
  }, [elapsedSeconds, running, duration, soundOn, playBeep]);

  const handleStopwatchStart = () => {
    // create/resume the audio context inside this user gesture so iOS allows sound later
    try {
      if (!audioCtxRef.current) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        audioCtxRef.current = new Ctx();
      }
      if (audioCtxRef.current.state === "suspended") audioCtxRef.current.resume();
    } catch (e) {}
    // Only auto-fill on a fresh start (not a resume-from-pause), and only into
    // fields that are still blank — never overwrite something already entered.
    if (elapsedSeconds === 0) {
      setHeader((h) => ({
        ...h,
        obsDate: h.obsDate || todayDateStr(),
        startTime: h.startTime || nowTimeStr(),
      }));
      markDirty();
    }
    startTimeRef.current = Date.now();
    setRunning(true);
  };

  const handleStopwatchPause = () => {
    accumulatedRef.current += Date.now() - (startTimeRef.current ?? Date.now());
    setRunning(false);
  };

  const handleStopwatchReset = () => {
    setRunning(false);
    accumulatedRef.current = 0;
    startTimeRef.current = null;
    lastBeepIndexRef.current = -1;
    setElapsedSeconds(0);
  };

  const formatMMSS = (totalSeconds) => {
    const m = Math.floor(totalSeconds / 60);
    const s = totalSeconds % 60;
    return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
  };

  const activeReading = useMemo(() => {
    const idx = Math.floor(elapsedSeconds / 15);
    const row = Math.min(Math.floor(idx / 4), rows.length - 1);
    const col = idx % 4;
    return { row, col };
  }, [elapsedSeconds, rows.length]);

  // auto-scroll the reading grid to keep the current row visible while the stopwatch runs
  useEffect(() => {
    if (running && rowRefs.current[activeReading.row]) {
      rowRefs.current[activeReading.row].scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
  }, [activeReading.row, running]);

  // ---------- source layout sketch (tap-and-place icons) ----------
  // sketchItems is the source of truth: an array of {id, type, x, y, deg?}.
  // The canvas is always just a redraw of template + these items — no freehand
  // strokes to accumulate, so it's simple to persist, restore, and edit later.
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    drawSketchTemplate(ctx, canvas.width, canvas.height);
    sketchItems.forEach((item) => {
      if (item.type === "stack") drawStackIconAt(ctx, item.x, item.y);
      else if (item.type === "sun") drawSunIconAt(ctx, item.x, item.y);
      else if (item.type === "wind") drawWindIconAt(ctx, item.x, item.y, item.deg || 0);
    });
  }, [sketchItems]);

  const getCanvasPos = (e) => {
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
  };

  // Tap with a tool selected: place that icon. Tap with no tool selected: remove
  // whichever placed icon is closest to the tap, if any is close enough.
  const handleCanvasTap = (e) => {
    const pos = getCanvasPos(e);
    if (activeSketchTool) {
      const deg =
        activeSketchTool === "wind"
          ? parseLeadingNumber(header.windDirEnd) ?? parseLeadingNumber(header.windDirStart) ?? 0
          : undefined;
      setSketchItems((items) => [
        ...items,
        { id: Date.now() + Math.random(), type: activeSketchTool, x: pos.x, y: pos.y, deg },
      ]);
      markDirty();
    } else {
      setSketchItems((items) => {
        const threshold = 22;
        let closestIdx = -1;
        let closestDist = threshold;
        items.forEach((item, idx) => {
          const d = Math.hypot(item.x - pos.x, item.y - pos.y);
          if (d < closestDist) {
            closestDist = d;
            closestIdx = idx;
          }
        });
        if (closestIdx === -1) return items;
        const next = items.slice();
        next.splice(closestIdx, 1);
        return next;
      });
      markDirty();
    }
  };

  const clearSketch = () => {
    setSketchItems([]);
    markDirty();
  };

  // The canvas always has content — either just the light-gray template guide,
  // or the template plus whatever's been placed — since the redraw effect runs
  // regardless of visibility. Pulling straight from the canvas (rather than a
  // separately-stored image) means print always matches what's shown on screen.
  const getSketchImageSrc = () => {
    try {
      return canvasRef.current ? canvasRef.current.toDataURL("image/png") : "";
    } catch (e) {
      return "";
    }
  };

  const addSunWindToSketch = (target) => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const coords = weatherState[target].coords;
    if (!coords) {
      setStatus(`Fetch local weather for "${target}" first — that's what supplies the location for the sun calc.`);
      return;
    }
    const windStr = target === "start" ? header.windDirStart : header.windDirEnd;
    const windAz = parseLeadingNumber(windStr);
    if (windAz === null) {
      setStatus(`No wind direction captured yet for "${target}".`);
      return;
    }

    const dateForCalc = weatherState[target].fetchedAt ? new Date(weatherState[target].fetchedAt) : new Date();
    const sun = computeSunAzimuth(dateForCalc, coords.lat, coords.lon);

    const anchor = { x: canvas.width / 2, y: canvas.height / 2 };
    const radius = Math.min(canvas.width, canvas.height) * 0.32;
    const toXY = (azDeg, r) => ({
      x: anchor.x + r * Math.sin((azDeg * Math.PI) / 180),
      y: anchor.y - r * Math.cos((azDeg * Math.PI) / 180),
    });

    const windTip = toXY(windAz, radius);
    const sunTip = toXY(sun.azimuthDeg, radius * 0.85);

    setSketchItems((items) => [
      ...items,
      { id: Date.now() + Math.random(), type: "wind", x: windTip.x, y: windTip.y, deg: windAz },
      { id: Date.now() + Math.random() + 1, type: "sun", x: sunTip.x, y: sunTip.y },
    ]);
    markDirty();

    // sun check against direction-to-emission-point (140° sector rule)
    const dirStr = target === "start" ? header.dirEmissionStart : header.dirEmissionEnd;
    const dirAz = parseLeadingNumber(dirStr);

    if (dirAz !== null) {
      const behindAz = (dirAz + 180) % 360;
      const diff = Math.abs(((sun.azimuthDeg - behindAz + 540) % 360) - 180);
      const pass = diff <= 70;
      setStatus(
        pass
          ? `Sun check (${target}) OK — sun is ${Math.round(diff)}° off directly-behind-you.`
          : `Sun check (${target}): sun is ${Math.round(diff)}° off directly-behind-you — outside the 140° sector, consider repositioning.`
      );
    } else {
      setStatus(`Added sun & wind for "${target}" to the sketch. Enter Direction to Emission Point to also run the sun check.`);
    }
  };

  // ---------- distance & angle helper (height / tan(angle) method) ----------
  const stopTiltSensor = useCallback(() => {
    if (orientationListenerRef.current) {
      window.removeEventListener("deviceorientation", orientationListenerRef.current);
      orientationListenerRef.current = null;
    }
  }, []);

  useEffect(() => stopTiltSensor, [stopTiltSensor]); // stop listening on unmount

  // Camera is a visual aiming aid only — it doesn't measure anything itself,
  // it just lets you see you're actually sighting the top of the stack while
  // the tilt sensor (below) captures the real angle.
  const stopCamera = useCallback(() => {
    if (cameraStreamRef.current) {
      cameraStreamRef.current.getTracks().forEach((track) => track.stop());
      cameraStreamRef.current = null;
    }
    if (videoRef.current) videoRef.current.srcObject = null;
    setCameraStatus("idle");
  }, []);

  useEffect(() => stopCamera, [stopCamera]); // release the camera on unmount

  // Runs after cameraStatus flips to "active", which is when the <video>
  // element actually mounts (it's conditionally rendered) — so this is the
  // correct place to attach the already-acquired stream, not inline in
  // startCamera where the element wouldn't exist yet.
  useEffect(() => {
    if (cameraStatus === "active" && videoRef.current && cameraStreamRef.current) {
      videoRef.current.srcObject = cameraStreamRef.current;
      videoRef.current.play().catch(() => {});
    }
  }, [cameraStatus]);

  const startCamera = async () => {
    setCameraStatus("requesting");
    setCameraError("");
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setCameraStatus("error");
        setCameraError("Camera isn't available in this browser.");
        return;
      }
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" } },
        audio: false,
      });
      cameraStreamRef.current = stream;
      // Don't touch videoRef here — the <video> element only renders once
      // cameraStatus becomes "active", so it doesn't exist in the DOM yet at
      // this point. Attaching the stream happens in the effect below, which
      // runs after that render has actually mounted the element.
      setCameraStatus("active");
    } catch (e) {
      setCameraStatus("error");
      setCameraError(
        e && e.name === "NotAllowedError"
          ? "Camera permission denied — you can still use the tilt sensor without it."
          : "Couldn't start the camera — you can still use the tilt sensor without it."
      );
    }
  };

  const startTiltSensor = async () => {
    setSensorStatus("requesting");
    try {
      const DOE = window.DeviceOrientationEvent;
      if (DOE && typeof DOE.requestPermission === "function") {
        const perm = await DOE.requestPermission();
        if (perm !== "granted") {
          setSensorStatus("denied");
          return;
        }
      } else if (!DOE) {
        setSensorStatus("unsupported");
        return;
      }
      const handler = (e) => {
        if (e.beta !== null && e.beta !== undefined) {
          setLiveBeta(e.beta);
          setSensorStatus("active");
        }
      };
      orientationListenerRef.current = handler;
      window.addEventListener("deviceorientation", handler);
      setTimeout(() => {
        setSensorStatus((s) => (s === "requesting" ? "unsupported" : s));
      }, 1500);
    } catch (e) {
      setSensorStatus("denied");
    }
  };

  const setLevelZero = () => {
    if (liveBeta !== null) setZeroBeta(liveBeta);
  };

  const captureAngle = () => {
    if (liveBeta !== null && zeroBeta !== null) {
      setAngleInput(Math.abs(liveBeta - zeroBeta).toFixed(1));
    }
  };

  const heightNum = parseFloat(heightInput);
  const angleNum = parseFloat(angleInput);
  const computedDistanceFt =
    !isNaN(heightNum) && !isNaN(angleNum) && angleNum > 0 && angleNum < 90
      ? heightNum / Math.tan((angleNum * Math.PI) / 180)
      : null;

  const insertDistance = (target) => {
    if (computedDistanceFt === null) return;
    updateHeader(target === "start" ? "distEmissionStart" : "distEmissionEnd", String(Math.round(computedDistanceFt)));
  };

  const insertAngle = (target) => {
    if (angleInput === "") return;
    updateHeader(target === "start" ? "vertAngleStart" : "vertAngleEnd", angleInput);
  };

  // Reverse calculation: if the horizontal distance is already known (paced off,
  // from a site map, etc.), use the same captured angle to solve for height instead.
  const knownDistanceNum = parseFloat(knownDistanceInput);
  const computedHeightFt =
    !isNaN(knownDistanceNum) && !isNaN(angleNum) && angleNum > 0 && angleNum < 90
      ? knownDistanceNum * Math.tan((angleNum * Math.PI) / 180)
      : null;

  const insertHeight = (target) => {
    if (computedHeightFt === null) return;
    updateHeader(target === "point" ? "heightEmissionPoint" : "heightRelativeObserver", String(Math.round(computedHeightFt)));
  };

  // ---------- GPS distance & direction (from map coordinates) ----------
  const observerLatNum = parseFloat(header.latitude);
  const observerLngNum = parseFloat(header.longitude);
  const emissionLatNum = parseFloat(emissionLat);
  const emissionLngNum = parseFloat(emissionLng);
  const gpsInputsValid =
    !isNaN(observerLatNum) && !isNaN(observerLngNum) && !isNaN(emissionLatNum) && !isNaN(emissionLngNum);
  const gpsDistanceFt = gpsInputsValid
    ? haversineDistanceFt(observerLatNum, observerLngNum, emissionLatNum, emissionLngNum)
    : null;
  const gpsBearingDeg = gpsInputsValid
    ? initialBearingDeg(observerLatNum, observerLngNum, emissionLatNum, emissionLngNum)
    : null;

  const insertGpsDistance = (target) => {
    if (gpsDistanceFt === null) return;
    updateHeader(target === "start" ? "distEmissionStart" : "distEmissionEnd", String(Math.round(gpsDistanceFt)));
  };

  const insertGpsBearing = (target) => {
    if (gpsBearingDeg === null) return;
    updateHeader(target === "start" ? "dirEmissionStart" : "dirEmissionEnd", String(Math.round(gpsBearingDeg)));
  };

  // ---------- interactive aerial map (tap to drop a pin on the emission point) ----------
  const initMap = () => {
    if (leafletMapRef.current) return; // already initialized
    if (typeof window.L === "undefined") {
      setMapStatus("error");
      setMapErrorMsg("Map library didn't load — check your connection and try again.");
      return;
    }
    setMapStatus("loading");

    const startLat = parseFloat(header.latitude) || 0;
    const startLng = parseFloat(header.longitude) || 0;
    const map = window.L.map(mapContainerRef.current).setView([startLat, startLng], startLat ? 18 : 3);
    window.L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
      attribution: "Tiles &copy; Esri",
      maxZoom: 20,
    }).addTo(map);

    map.on("click", (e) => {
      setEmissionLat(e.latlng.lat.toFixed(6));
      setEmissionLng(e.latlng.lng.toFixed(6));
      if (pinMarkerRef.current) {
        pinMarkerRef.current.setLatLng(e.latlng);
      } else {
        pinMarkerRef.current = window.L.marker(e.latlng).addTo(map).bindPopup("Emission point").openPopup();
      }
    });

    leafletMapRef.current = map;
    setMapStatus("ready");
    centerOnMe();
  };

  const loadLeafletThenInit = () => {
    if (typeof window.L !== "undefined") {
      initMap();
      return;
    }
    setMapStatus("loading");
    if (!document.getElementById("leaflet-css-m9")) {
      const link = document.createElement("link");
      link.id = "leaflet-css-m9";
      link.rel = "stylesheet";
      link.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
      document.head.appendChild(link);
    }
    let script = document.getElementById("leaflet-js-m9");
    if (!script) {
      script = document.createElement("script");
      script.id = "leaflet-js-m9";
      script.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
      document.head.appendChild(script);
    }
    script.addEventListener("load", () => initMap(), { once: true });
    script.addEventListener(
      "error",
      () => {
        setMapStatus("error");
        setMapErrorMsg("Couldn't load the map library from unpkg.com — check your connection and try again.");
      },
      { once: true }
    );
  };

  const centerOnMe = () => {
    if (!navigator.geolocation || !leafletMapRef.current) return;
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const { latitude, longitude } = pos.coords;
        const map = leafletMapRef.current;
        map.setView([latitude, longitude], 18);
        if (youMarkerRef.current) {
          youMarkerRef.current.setLatLng([latitude, longitude]);
        } else {
          youMarkerRef.current = window.L.circleMarker([latitude, longitude], {
            radius: 8,
            color: "#2563eb",
            fillColor: "#3b82f6",
            fillOpacity: 0.9,
          })
            .addTo(map)
            .bindPopup("You");
        }
        // Also keep the form's own Latitude/Longitude fields in sync if they're empty
        setHeader((h) => ({
          ...h,
          latitude: h.latitude || latitude.toFixed(6),
          longitude: h.longitude || longitude.toFixed(6),
        }));
      },
      () => {
        setMapErrorMsg("Couldn't get your location — you can still tap the map to drop a pin manually.");
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  };

  const clearPin = () => {
    if (pinMarkerRef.current && leafletMapRef.current) {
      leafletMapRef.current.removeLayer(pinMarkerRef.current);
      pinMarkerRef.current = null;
    }
    setEmissionLat("");
    setEmissionLng("");
  };

  const toggleMap = () => {
    setShowMap((v) => !v);
  };

  useEffect(() => {
    if (showMap) {
      // defer init one tick so the container div has been rendered/sized first
      const t = setTimeout(loadLeafletThenInit, 0);
      return () => clearTimeout(t);
    }
  }, [showMap]);
  useEffect(() => {
    const interval = setInterval(() => {
      saveDraft();
    }, AUTOSAVE_MS);
    return () => clearInterval(interval);
  }, []);

  // save draft silently (backup), doesn't touch the named-session index
  const saveDraft = useCallback(async () => {
    const s = stateRef.current;
    const payload = JSON.stringify({
      header: s.header,
      duration: s.duration,
      rows: s.rows,
      comments: s.comments,
      opacityLimit: s.opacityLimit,
      sessionId: s.sessionId,
      sessionLabel: s.sessionLabel,
      sketchItems: s.sketchItems,
      savedAt: Date.now(),
    });
    const ok = await storageSet(DRAFT_KEY, payload);
    if (ok) setStatus(`Backed up automatically at ${nowLabel()}`);

    const siteIdentity = {};
    SITE_IDENTITY_FIELDS.forEach((key) => {
      siteIdentity[key] = s.header[key] || "";
    });
    if (Object.values(siteIdentity).some((v) => v)) {
      storageSet(SITE_IDENTITY_KEY, JSON.stringify(siteIdentity));
    }
  }, []);

  // mark dirty on any edit, and also opportunistically backup on field blur handled elsewhere
  const markDirty = () => setDirty(true);

  const updateHeader = (key, value) => {
    setHeader((h) => ({ ...h, [key]: value }));
    markDirty();
  };

  const applyWeatherForCoords = async (target, latitude, longitude) => {
    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,wind_direction_10m,weather_code&temperature_unit=fahrenheit&wind_speed_unit=mph`;
      const res = await fetch(url);
      if (!res.ok) throw new Error("Weather service unavailable");
      const data = await res.json();
      const c = data.current;
      if (!c) throw new Error("No current conditions returned");

      const tempF = Math.round(c.temperature_2m);
      const windMph = Math.round(c.wind_speed_10m);
      const windDirDeg = Math.round(c.wind_direction_10m);
      const compass = degreesToCompass(windDirDeg);
      const sky = wmoToSky(c.weather_code);
      const rh = Math.round(c.relative_humidity_2m);

      const tempKey = target === "start" ? "ambientTempStart" : "ambientTempEnd";
      const windSpeedKey = target === "start" ? "windSpeedStart" : "windSpeedEnd";
      const windDirKey = target === "start" ? "windDirStart" : "windDirEnd";
      const skyKey = target === "start" ? "skyStart" : "skyEnd";

      setHeader((h) => ({
        ...h,
        [tempKey]: String(tempF),
        [windSpeedKey]: String(windMph),
        [windDirKey]: `${windDirDeg}° (${compass})`,
        [skyKey]: sky,
        rhPercent: String(rh),
        latitude: h.latitude || latitude.toFixed(5),
        longitude: h.longitude || longitude.toFixed(5),
      }));
      markDirty();

      setWeatherState((w) => ({
        ...w,
        [target]: {
          loading: false,
          error: "",
          fetchedAt: Date.now(),
          summary: `${tempF}°F, wind ${windMph} mph ${compass}, ${sky}, RH ${rh}%`,
          coords: { lat: latitude, lon: longitude },
        },
      }));
    } catch (e) {
      setWeatherState((w) => ({
        ...w,
        [target]: { ...w[target], loading: false, error: "Couldn't reach the weather service — enter readings manually.", fetchedAt: null, summary: "" },
      }));
    }
  };

  const fetchLocalWeather = (target) => {
    // target is "start" or "end"
    setWeatherState((w) => ({ ...w, [target]: { ...w[target], loading: true, error: "" } }));

    if (!navigator.geolocation) {
      setWeatherState((w) => ({
        ...w,
        [target]: { loading: false, error: "Location isn't available in this browser — try typing your city or zip below.", fetchedAt: null, summary: "", coords: null },
      }));
      return;
    }

    navigator.geolocation.getCurrentPosition(
      (pos) => applyWeatherForCoords(target, pos.coords.latitude, pos.coords.longitude),
      () => {
        setWeatherState((w) => ({
          ...w,
          [target]: { loading: false, error: "Location permission denied — try typing your city or zip below instead.", fetchedAt: null, summary: "", coords: null },
        }));
      },
      { enableHighAccuracy: false, timeout: 10000 }
    );
  };

  const fetchWeatherByPlace = async (target) => {
    const query = (manualQuery[target] || "").trim();
    if (!query) return;
    setWeatherState((w) => ({ ...w, [target]: { ...w[target], loading: true, error: "" } }));
    try {
      const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1`;
      const res = await fetch(geoUrl);
      if (!res.ok) throw new Error("Geocoding service unavailable");
      const data = await res.json();
      const first = data.results && data.results[0];
      if (!first) {
        setWeatherState((w) => ({
          ...w,
          [target]: { ...w[target], loading: false, error: `Couldn't find "${query}" — try a city name, or "city, state".` },
        }));
        return;
      }
      await applyWeatherForCoords(target, first.latitude, first.longitude);
    } catch (e) {
      setWeatherState((w) => ({
        ...w,
        [target]: { ...w[target], loading: false, error: "Couldn't reach the weather/geocoding service from here — enter readings manually." },
      }));
    }
  };

  const updateCell = (rowIdx, colIdx, value) => {
    if (value !== "" && !/^\d{0,3}$/.test(value)) return;
    if (value !== "" && Number(value) > 100) return;
    setRows((r) => {
      const next = r.map((row) => row.slice());
      next[rowIdx][colIdx] = value;
      return next;
    });
    markDirty();
  };

  const updateComment = (rowIdx, value) => {
    setComments((c) => {
      const next = c.slice();
      next[rowIdx] = value;
      return next;
    });
    markDirty();
  };

  const changeDuration = (mins) => {
    setDuration(mins);
    setRows((r) => {
      if (mins > r.length) {
        return [...r, ...makeBlankRows(mins - r.length)];
      }
      return r.slice(0, mins);
    });
    setComments((c) => {
      if (mins > c.length) {
        return [...c, ...makeBlankComments(mins - c.length)];
      }
      return c.slice(0, mins);
    });
    setHeader((h) => ({ ...h, pageOf: h.pageOf === "1" || h.pageOf === "2" ? String(mins === 60 ? 2 : 1) : h.pageOf }));
    markDirty();
  };

  // ---------- Method 9 six-minute block averages ----------
  const blocks = useMemo(() => {
    const out = [];
    for (let b = 0; b * 6 < rows.length; b++) {
      const startRow = b * 6;
      const endRow = Math.min(startRow + 6, rows.length);
      let sum = 0;
      let count = 0;
      for (let r = startRow; r < endRow; r++) {
        for (let c = 0; c < 4; c++) {
          const v = rows[r][c];
          if (v !== "") {
            sum += Number(v);
            count += 1;
          }
        }
      }
      const complete = endRow - startRow === 6 && count === 24;
      out.push({
        label: `Min ${startRow + 1}–${endRow}`,
        average: count > 0 ? sum / count : null,
        count,
        complete,
      });
    }
    return out;
  }, [rows]);

  const overallAverage = useMemo(() => {
    let sum = 0;
    let count = 0;
    rows.forEach((row) =>
      row.forEach((v) => {
        if (v !== "") {
          sum += Number(v);
          count += 1;
        }
      })
    );
    return count > 0 ? sum / count : null;
  }, [rows]);

  const highestBlockAvg = useMemo(() => {
    const vals = blocks.filter((b) => b.average !== null).map((b) => b.average);
    return vals.length ? Math.max(...vals) : null;
  }, [blocks]);

  const limitNum = opacityLimit === "" ? null : Number(opacityLimit);

  // ---------- save / load named readings ----------
  const saveReading = async (asNew) => {
    const id = asNew || !sessionId ? `m9-${Date.now()}` : sessionId;
    const label =
      sessionLabel ||
      header.company ||
      header.emissionPointDesc ||
      `Reading ${nowLabel()}`;
    const record = {
      id,
      label,
      header,
      duration,
      rows,
      comments,
      opacityLimit,
      sketchItems,
      savedAt: Date.now(),
    };
    const ok = await storageSet(`session-${id}`, JSON.stringify(record));
    if (!ok) {
      setStatus("Save failed — please try again");
      return;
    }
    const newIndexEntry = {
      id,
      label,
      date: header.obsDate || "",
      company: header.company || "",
      updatedAt: Date.now(),
    };
    const nextIndex = [newIndexEntry, ...savedList.filter((s) => s.id !== id)];
    setSavedList(nextIndex);
    await storageSet(INDEX_KEY, JSON.stringify(nextIndex));
    setSessionId(id);
    setSessionLabel(label);
    setDirty(false);
    setStatus(`Saved as "${label}" at ${nowLabel()}`);
    // also refresh the draft backup so restoring after reload points at the saved record
    saveDraft();
  };

  const loadReading = async (id) => {
    const raw = await storageGet(`session-${id}`);
    if (!raw) {
      setStatus("Could not find that saved reading");
      return;
    }
    try {
      const d = JSON.parse(raw);
      setHeader({ ...emptyHeader, ...d.header });
      setDuration(d.duration || 30);
      setRows(d.rows && d.rows.length ? d.rows : makeBlankRows(d.duration || 30));
      setComments(d.comments && d.comments.length ? d.comments : makeBlankComments(d.duration || 30));
      setOpacityLimit(d.opacityLimit ?? "20");
      setSessionId(d.id);
      setSessionLabel(d.label);
      setSketchItems(Array.isArray(d.sketchItems) ? d.sketchItems : []);
      setShowLoadPanel(false);
      setDirty(false);
      setStatus(`Loaded "${d.label}"`);
      handleStopwatchReset();
    } catch (e) {
      setStatus("That saved reading appears to be corrupted");
    }
  };

  const startNew = async () => {
    if (dirty && !window.confirm("Start a new reading? Anything unsaved will be lost from view (a backup copy stays in Restore).")) {
      return;
    }
    let nextHeader = emptyHeader;
    const siteRaw = await storageGet(SITE_IDENTITY_KEY);
    if (siteRaw) {
      try {
        nextHeader = { ...emptyHeader, ...JSON.parse(siteRaw) };
      } catch (e) {
        /* ignore corrupt site identity, fall back to blank */
      }
    }
    setHeader(nextHeader);
    setDuration(30);
    setRows(makeBlankRows(30));
    setComments(makeBlankComments(30));
    setOpacityLimit("20");
    setSessionId(null);
    setSessionLabel("");
    setSketchItems([]);
    setDirty(false);
    setStatus("Started a new reading — site info carried over");
    handleStopwatchReset();
  };

  const loadExample = () => {
    if (dirty && !window.confirm("Load the example reading? Anything unsaved will be lost from view (a backup copy stays in Restore).")) {
      return;
    }
    setHeader(exampleHeader);
    setDuration(30);
    setRows(makeExampleRows());
    setComments(makeBlankComments(30));
    setOpacityLimit("20");
    setSessionId(null);
    setSessionLabel("Example (Ascend Performance Materials)");
    setSketchItems([]);
    setDirty(false);
    setStatus("Loaded the example reading from the real submitted form");
    handleStopwatchReset();
  };

  const handlePrint = () => {
    window.print();
  };

  // ---------- small field components are defined outside this component, see below ----------

  return (
    <div className="min-h-screen bg-stone-100 text-slate-800 print:bg-white">
      {/* ---------- Toolbar ---------- */}
      <div
        className="sticky top-0 z-20 bg-slate-900 text-stone-100 shadow-md print:hidden"
        style={{ paddingTop: "env(safe-area-inset-top)" }}
      >
        <div className="max-w-6xl mx-auto px-3 sm:px-4 pt-3">
          <div className="flex items-baseline gap-2 mb-2">
            <span className="font-mono text-amber-400 text-lg sm:text-xl font-bold tracking-tight">
              METHOD 9
            </span>
            <span className="text-xs text-slate-400 hidden sm:inline">
              Visible Emissions Observation — 40 CFR 60 App. A
            </span>
          </div>

          <div className="grid grid-cols-4 gap-2 sm:flex sm:gap-2 pb-3">
            <button
              onClick={startNew}
              className="px-2 py-2.5 text-sm rounded border border-slate-600 active:bg-slate-800 sm:hover:bg-slate-800 transition"
            >
              New
            </button>
            <button
              onClick={() => setShowLoadPanel((v) => !v)}
              className="px-2 py-2.5 text-sm rounded border border-slate-600 active:bg-slate-800 sm:hover:bg-slate-800 transition"
            >
              Open ({savedList.length})
            </button>
            <button
              onClick={() => saveReading(false)}
              className="px-2 py-2.5 text-sm rounded bg-amber-500 text-slate-900 font-semibold active:bg-amber-400 sm:hover:bg-amber-400 transition"
            >
              Save
            </button>
            <button
              onClick={handlePrint}
              className="px-2 py-2.5 text-sm rounded border border-slate-600 active:bg-slate-800 sm:hover:bg-slate-800 transition"
            >
              Print
            </button>
          </div>
        </div>
        <div className="max-w-6xl mx-auto px-3 sm:px-4 pb-2 text-xs text-slate-400 flex flex-col sm:flex-row sm:justify-between gap-0.5">
          <span>{status}{dirty ? " — unsaved changes" : ""}</span>
          <span className="flex gap-3 print:hidden">
            {restoredDraft && <span className="text-amber-400">Draft restored</span>}
            <button onClick={loadExample} className="underline active:text-slate-200 sm:hover:text-slate-200">
              Load example data
            </button>
          </span>
        </div>
      </div>

      {showLoadPanel && (
        <div className="max-w-6xl mx-auto px-3 sm:px-4 mt-3 print:hidden">
          <div className="bg-white border border-slate-300 rounded shadow-sm p-3">
            <div className="text-sm font-semibold mb-2">Saved readings</div>
            {savedList.length === 0 && (
              <div className="text-sm text-slate-500">Nothing saved yet.</div>
            )}
            <div className="divide-y divide-slate-100 max-h-64 overflow-y-auto">
              {savedList.map((s) => (
                <button
                  key={s.id}
                  onClick={() => loadReading(s.id)}
                  className="w-full text-left py-3 px-1 active:bg-stone-50 sm:hover:bg-stone-50 flex flex-col sm:flex-row sm:justify-between sm:items-center text-sm gap-0.5"
                >
                  <span>
                    <span className="font-medium">{s.label}</span>
                    {s.company ? <span className="text-slate-400"> — {s.company}</span> : null}
                  </span>
                  <span className="text-xs text-slate-400">
                    {new Date(s.updatedAt).toLocaleDateString()}
                  </span>
                </button>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* ---------- Printable sheet ---------- */}
      <div className="max-w-6xl mx-auto p-3 sm:p-4 print:p-0 print:max-w-none">
        <div className="bg-white border border-slate-300 rounded shadow-sm p-3 sm:p-5 m9-editform">
          <div className="text-center mb-4 print:mb-2">
            <div className="font-bold text-base sm:text-lg">EPA VISIBLE EMISSION OBSERVATION FORM</div>
          </div>

          {/* Method used + form/page tracking */}
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-3 pb-3 border-b border-slate-300 m9-grid-4">
            <Field label="Method Used" wide>
              <div className="flex flex-wrap gap-3 items-center h-full">
                {["Method 9", "203A", "203B", "Other"].map((opt) => (
                  <label key={opt} className="flex items-center gap-1.5 text-sm py-1">
                    <input
                      type="radio"
                      name="methodUsed"
                      checked={header.methodUsed === opt}
                      onChange={() => updateHeader("methodUsed", opt)}
                      className="w-4 h-4"
                    />
                    {opt}
                  </label>
                ))}
                {header.methodUsed === "Other" && (
                  <Text value={header.methodOther} onChange={(v) => updateHeader("methodOther", v)} placeholder="Specify" />
                )}
              </div>
            </Field>
            <Field label="Form Number">
              <Text value={header.formNumber} onChange={(v) => updateHeader("formNumber", v)} />
            </Field>
            <Field label="Page / Of">
              <div className="flex items-center gap-1">
                <Text value={header.pageNum} onChange={(v) => updateHeader("pageNum", v)} />
                <span className="text-slate-400">/</span>
                <Text value={header.pageOf} onChange={(v) => updateHeader("pageOf", v)} />
              </div>
            </Field>
            <Field label="Continued on VEO Form Number">
              <Text value={header.continuedOnForm} onChange={(v) => updateHeader("continuedOnForm", v)} />
            </Field>
          </div>

          {/* Facility info */}
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-3 m9-grid-4">
            <Field label="Company Name" wide>
              <Text value={header.company} onChange={(v) => updateHeader("company", v)} />
            </Field>
            <Field label="Observation Date">
              <Text value={header.obsDate} onChange={(v) => updateHeader("obsDate", v)} placeholder="2026-05-26" />
            </Field>
            <Field label="Time Zone">
              <Text value={header.timeZone} onChange={(v) => updateHeader("timeZone", v)} placeholder="CST" />
            </Field>

            <Field label="Facility Name" wide>
              <Text value={header.facilityName} onChange={(v) => updateHeader("facilityName", v)} />
            </Field>
            <Field label="Start Time">
              <Text value={header.startTime} onChange={(v) => updateHeader("startTime", v)} placeholder="09:39 AM" />
            </Field>
            <Field label="End Time">
              <Text value={header.endTime} onChange={(v) => updateHeader("endTime", v)} placeholder="10:59 AM" />
            </Field>

            <Field label="Street Address" wide>
              <Text value={header.streetAddress} onChange={(v) => updateHeader("streetAddress", v)} />
            </Field>
            <Field label="Reading Length">
              <select
                value={duration}
                onChange={(e) => changeDuration(Number(e.target.value))}
                className="border border-slate-300 rounded px-2 py-2 sm:py-1 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400 w-full"
              >
                <option value={30}>30 minutes</option>
                <option value={60}>60 minutes</option>
              </select>
            </Field>
            <div className="hidden sm:block" />

            <Field label="City">
              <Text value={header.city} onChange={(v) => updateHeader("city", v)} />
            </Field>
            <Field label="State">
              <Text value={header.state} onChange={(v) => updateHeader("state", v)} />
            </Field>
            <Field label="Zip">
              <Text value={header.zip} onChange={(v) => updateHeader("zip", v)} />
            </Field>

            <Field label="Process">
              <Text value={header.processEquip} onChange={(v) => updateHeader("processEquip", v)} />
            </Field>
            <Field label="Unit #">
              <Text value={header.unitNumber} onChange={(v) => updateHeader("unitNumber", v)} />
            </Field>
            <Field label="Operating Mode">
              <Text value={header.processMode} onChange={(v) => updateHeader("processMode", v)} />
            </Field>
            <Field label="Control Equipment">
              <Text value={header.controlEquip} onChange={(v) => updateHeader("controlEquip", v)} />
            </Field>

            <Field label="Operating Mode">
              <Text value={header.controlMode} onChange={(v) => updateHeader("controlMode", v)} />
            </Field>
            <Field label="Describe Emission Point" wide>
              <Text value={header.emissionPointDesc} onChange={(v) => updateHeader("emissionPointDesc", v)} />
            </Field>

            <Field label="Height of Emiss. Pt. (ft)">
              <Text value={header.heightEmissionPoint} onChange={(v) => updateHeader("heightEmissionPoint", v)} />
            </Field>
            <Field label="Height of Emiss. Pt. Rel. to Observer (ft)">
              <Text value={header.heightRelativeObserver} onChange={(v) => updateHeader("heightRelativeObserver", v)} />
            </Field>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-4 gap-3 mb-3 m9-grid-4">
            <StartEnd label="Distance to Emiss. Pt." startKey="distEmissionStart" endKey="distEmissionEnd" unit="ft" header={header} updateHeader={updateHeader} />
            <StartEnd label="Direction to Emiss. Pt." startKey="dirEmissionStart" endKey="dirEmissionEnd" unit="0–360°" header={header} updateHeader={updateHeader} />
            <StartEnd label="Vertical Angle to Observation Point" startKey="vertAngleStart" endKey="vertAngleEnd" unit="°" header={header} updateHeader={updateHeader} />
            <StartEnd label="Direction to Observation Point" startKey="dirObsPointStart" endKey="dirObsPointEnd" unit="0–360°" header={header} updateHeader={updateHeader} />
            <StartEnd label="Distance & Direction, Obs. Point from Emission Point" startKey="distDirObsStart" endKey="distDirObsEnd" header={header} updateHeader={updateHeader} />
            <StartEnd label="Describe Emissions" startKey="emissionsDescStart" endKey="emissionsDescEnd" header={header} updateHeader={updateHeader} />
            <StartEnd label="Emission Color" startKey="emissionColorStart" endKey="emissionColorEnd" header={header} updateHeader={updateHeader} />

            <Field label="Water Droplet Plume" wide>
              <div className="flex flex-wrap gap-4 items-center h-full">
                {["attached", "detached", "none"].map((opt) => (
                  <label key={opt} className="flex items-center gap-2 text-sm capitalize py-1">
                    <input
                      type="radio"
                      name="waterDroplet"
                      checked={header.waterDroplet === opt}
                      onChange={() => updateHeader("waterDroplet", opt)}
                      className="w-4 h-4"
                    />
                    {opt}
                  </label>
                ))}
              </div>
            </Field>

            <StartEnd label="Describe Plume Background" startKey="plumeBgStart" endKey="plumeBgEnd" header={header} updateHeader={updateHeader} />
            <StartEnd label="Background Color" startKey="bgColorStart" endKey="bgColorEnd" header={header} updateHeader={updateHeader} />
            <StartEnd label="Sky Conditions" startKey="skyStart" endKey="skyEnd" header={header} updateHeader={updateHeader} />
            <StartEnd label="Wind Speed" startKey="windSpeedStart" endKey="windSpeedEnd" unit="mph" header={header} updateHeader={updateHeader} />
            <StartEnd label="Wind Direction" startKey="windDirStart" endKey="windDirEnd" header={header} updateHeader={updateHeader} />
            <StartEnd label="Ambient Temp." startKey="ambientTempStart" endKey="ambientTempEnd" unit="°F" header={header} updateHeader={updateHeader} />

            <div className="grid grid-cols-2 gap-3">
              <Field label="Wet Bulb Temp (°F)">
                <Text value={header.wetBulbTemp} onChange={(v) => updateHeader("wetBulbTemp", v)} />
              </Field>
              <Field label="RH %">
                <Text value={header.rhPercent} onChange={(v) => updateHeader("rhPercent", v)} />
              </Field>
            </div>
          </div>

          {/* Distance & Angle Helper */}
          <div className="border border-slate-300 rounded p-3 mb-3 bg-stone-50 print:hidden">
            <div className="text-xs font-semibold uppercase tracking-wide text-slate-500 mb-2">
              Distance & Height Helper (height / tan(angle) method)
            </div>
            <div className="text-xs text-slate-500 mb-2">
              Enter the height difference between your eye and the emission point, and the vertical angle up to it,
              to estimate distance. Read the angle from your Measure or Compass app's Level, or try your phone's
              tilt sensor below (may not work from inside this embedded app — manual entry always works).
            </div>

            <div className="grid grid-cols-2 gap-3 mb-2">
              <Field label="Height difference (ft)">
                <input
                  type="number"
                  inputMode="decimal"
                  value={heightInput}
                  onChange={(e) => setHeightInput(e.target.value)}
                  className="border border-slate-300 rounded px-2 py-2 sm:py-1 text-sm w-full focus:outline-none focus:ring-2 focus:ring-amber-400"
                />
              </Field>
              <Field label="Angle above horizontal (°)">
                <input
                  type="number"
                  inputMode="decimal"
                  value={angleInput}
                  onChange={(e) => setAngleInput(e.target.value)}
                  className="border border-slate-300 rounded px-2 py-2 sm:py-1 text-sm w-full focus:outline-none focus:ring-2 focus:ring-amber-400"
                />
              </Field>
            </div>

            <div className="flex flex-wrap items-center gap-2 mb-2">
              {sensorStatus !== "active" ? (
                <button
                  onClick={startTiltSensor}
                  className="px-3 py-2 text-xs rounded bg-slate-800 text-stone-100 active:bg-slate-700 sm:hover:bg-slate-700 transition"
                >
                  {sensorStatus === "requesting" ? "Requesting…" : "Try iPhone tilt sensor"}
                </button>
              ) : (
                <>
                  <button
                    onClick={setLevelZero}
                    className="px-3 py-2 text-xs rounded border border-slate-400 active:bg-slate-200 sm:hover:bg-slate-200 transition"
                  >
                    Set level (0°)
                  </button>
                  <button
                    onClick={captureAngle}
                    disabled={zeroBeta === null}
                    className="px-3 py-2 text-xs rounded bg-amber-500 text-slate-900 font-semibold active:bg-amber-400 sm:hover:bg-amber-400 transition disabled:opacity-50"
                  >
                    Capture angle
                  </button>
                  <span className="text-xs text-slate-500">
                    live tilt: {liveBeta !== null ? liveBeta.toFixed(1) : "–"}°
                    {zeroBeta !== null ? ` (zeroed at ${zeroBeta.toFixed(1)}°)` : ""}
                  </span>
                </>
              )}
            </div>
            {sensorStatus === "denied" && (
              <div className="text-xs text-red-600 mb-2">Motion access wasn't granted — enter the angle manually instead.</div>
            )}
            {sensorStatus === "unsupported" && (
              <div className="text-xs text-red-600 mb-2">
                Tilt sensor isn't available here (common inside embedded browsers) — read the angle off your Measure or Compass app and type it in above.
              </div>
            )}

            <div className="flex items-center gap-2 mb-2">
              {cameraStatus !== "active" ? (
                <button
                  onClick={startCamera}
                  className="px-3 py-2 text-xs rounded border border-slate-400 active:bg-slate-200 sm:hover:bg-slate-200 transition"
                >
                  {cameraStatus === "requesting" ? "Requesting…" : "Use camera to aim"}
                </button>
              ) : (
                <button
                  onClick={stopCamera}
                  className="px-3 py-2 text-xs rounded border border-slate-400 active:bg-slate-200 sm:hover:bg-slate-200 transition"
                >
                  Stop camera
                </button>
              )}
              <span className="text-xs text-slate-400">Optional — just a visual aid, the tilt sensor above does the actual measuring.</span>
            </div>
            {cameraStatus === "error" && <div className="text-xs text-red-600 mb-2">{cameraError}</div>}
            {cameraStatus === "active" && (
              <div className="relative w-full mb-2 rounded overflow-hidden border border-slate-400" style={{ height: 220 }}>

            </Field>
          </div>

          {/* Additional info */}
          <Field label="Additional Information" wide>
            <textarea
              value={header.additionalInfo}
              onChange={(e) => updateHeader("additionalInfo", e.target.value)}
              rows={2}
              className="border border-slate-300 rounded px-2 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400 w-full"
            />
          </Field>

          {/* Certification */}
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-4 pt-3 border-t border-slate-300 m9-print-avoid-break m9-grid-2">
            <Field label="Observer's Name (Print)">
              <Text value={header.observerName} onChange={(v) => updateHeader("observerName", v)} />
            </Field>
            <Field label="Organization">
              <Text value={header.organization} onChange={(v) => updateHeader("organization", v)} />
            </Field>
            <Field label="Observer's Signature (typed)">
              <Text value={header.observerSignature} onChange={(v) => updateHeader("observerSignature", v)} />
            </Field>
            <Field label="Certified By">
              <Text value={header.certifiedBy} onChange={(v) => updateHeader("certifiedBy", v)} />
            </Field>
            <Field label="Date">
              <Text value={header.certifiedDate} onChange={(v) => updateHeader("certifiedDate", v)} placeholder="2026-05-26" />
            </Field>
          </div>
        </div>

        {/* ---------- Dedicated print-only layout — mirrors the real two-column paper form exactly, independent of the editable mobile layout above ---------- */}
        {(() => {
          const totalPages = Math.max(1, Math.ceil(rows.length / 30));

          const renderPrintPage = ({ pageNum, pageOf, pageRowsStart, pageRowsEnd, showFullDetails, showSummary, pageBreak }) => (
            <div key={pageNum} style={pageBreak ? { pageBreakBefore: "always" } : undefined}>
              <div style={{ textAlign: "center", fontWeight: 700, fontSize: 12, marginBottom: 4 }}>
                EPA VISIBLE EMISSION OBSERVATION FORM 1
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "48% 50%", columnGap: "2%" }}>
                {/* LEFT COLUMN */}
                <div>
                  <div style={{ fontSize: 9, marginBottom: 3, padding: "1px 4px", border: "1px solid #1e293b" }}>
                    <b>Method Used (Circle One):</b>{" "}
                    {["Method 9", "203A", "203B", "Other"].map((opt) => (
                      <span
                        key={opt}
                        style={{
                          marginRight: 6,
                          textDecoration: header.methodUsed === opt ? "underline" : "none",
                          fontWeight: header.methodUsed === opt ? 700 : 400,
                        }}
                      >
                        {opt}
                      </span>
                    ))}
                  </div>
                  <PrintField label="Company Name" value={header.company} />
                  <PrintField label="Facility Name" value={header.facilityName} />
                  <PrintField label="Street Address" value={header.streetAddress} />
                  <div style={{ display: "flex", gap: 2 }}>
                    <PrintField label="City" value={header.city} />
                    <PrintField label="State" value={header.state} />
                    <PrintField label="Zip" value={header.zip} />
                  </div>
                  <PrintField label="Process" value={header.processEquip} />
                  <div style={{ display: "flex", gap: 2 }}>
                    <PrintField label="Unit #" value={header.unitNumber} />
                    <PrintField label="Op. Mode" value={header.processMode} />
                  </div>
                  <div style={{ display: "flex", gap: 2 }}>
                    <PrintField label="Control Equip." value={header.controlEquip} />
                    <PrintField label="Op. Mode" value={header.controlMode} />
                  </div>

                  {showFullDetails && (
                    <>
                      <PrintField label="Describe Emission Point" value={header.emissionPointDesc} wrap />
                      <PrintField label="Height Emiss. Pt (ft)" value={header.heightEmissionPoint} />
                      <PrintField label="Height Rel. Observer (ft)" value={header.heightRelativeObserver} />
                      <PrintStartEnd label="Distance to Emiss. Pt." unit="ft" start={header.distEmissionStart} end={header.distEmissionEnd} />
                      <PrintStartEnd label="Direction to Emiss. Pt." unit="0–360°" start={header.dirEmissionStart} end={header.dirEmissionEnd} />
                      <PrintStartEnd label="Vertical Angle to Obs. Pt." unit="°" start={header.vertAngleStart} end={header.vertAngleEnd} />
                      <PrintStartEnd label="Direction to Obs. Pt." unit="0–360°" start={header.dirObsPointStart} end={header.dirObsPointEnd} />
                      <PrintStartEnd label="Dist. & Dir., Obs. Pt. from Emission Pt." start={header.distDirObsStart} end={header.distDirObsEnd} />
                      <PrintStartEnd label="Describe Emissions" start={header.emissionsDescStart} end={header.emissionsDescEnd} />
                      <PrintStartEnd label="Emission Color" start={header.emissionColorStart} end={header.emissionColorEnd} />
                      <div style={{ fontSize: 9, padding: "1px 4px", border: "1px solid #1e293b" }}>
                        <b>Water Droplet Plume:</b>{" "}
                        {["attached", "detached", "none"].map((opt) => (
                          <span
                            key={opt}
                            style={{
                              marginRight: 6,
                              textDecoration: header.waterDroplet === opt ? "underline" : "none",
                              fontWeight: header.waterDroplet === opt ? 700 : 400,
                              textTransform: "capitalize",
                            }}
                          >
                            {opt}
                          </span>
                        ))}
                      </div>
                      <PrintStartEnd label="Describe Plume Background" start={header.plumeBgStart} end={header.plumeBgEnd} />
                      <PrintStartEnd label="Background Color" start={header.bgColorStart} end={header.bgColorEnd} />
                      <PrintStartEnd label="Sky Conditions" start={header.skyStart} end={header.skyEnd} />
                      <PrintStartEnd label="Wind Speed" unit="mph" start={header.windSpeedStart} end={header.windSpeedEnd} />
                      <PrintStartEnd label="Wind Direction" start={header.windDirStart} end={header.windDirEnd} />
                      <PrintStartEnd label="Ambient Temp." unit="°F" start={header.ambientTempStart} end={header.ambientTempEnd} />
                      <div style={{ display: "flex", gap: 2 }}>
                        <PrintField label="Wet Bulb Temp (°F)" value={header.wetBulbTemp} />
                        <PrintField label="RH %" value={header.rhPercent} />
                      </div>

                      <div style={{ border: "1px solid #1e293b", marginTop: 3, padding: 2 }}>
                        <div style={{ fontSize: 8.5, fontWeight: 700, marginBottom: 2 }}>SOURCE LAYOUT SKETCH</div>
                        {getSketchImageSrc() ? (
                          <img src={getSketchImageSrc()} style={{ width: "100%", height: 110, objectFit: "contain" }} alt="" />
                        ) : (
                          <div style={{ height: 110 }} />
                        )}
                        <div style={{ fontSize: 8.5 }}>
                          North reference: {header.northRef === "TN" ? "True North" : "Magnetic North"}
                        </div>
                      </div>
                      <div style={{ display: "flex", gap: 2, marginTop: 2 }}>
                        <PrintField label="Longitude" value={header.longitude} />
                        <PrintField label="Latitude" value={header.latitude} />
                        <PrintField label="Declination" value={header.declination} />
                      </div>
                      <PrintField label="Additional Information" value={header.additionalInfo} wrap />
                    </>
                  )}
                </div>

                {/* RIGHT COLUMN */}
                <div>
                  <div style={{ display: "flex", gap: 2 }}>
                    <PrintField label="Form Number" value={header.formNumber} />
                    <PrintField label="Page" value={String(pageNum)} />
                    <PrintField label="Of" value={String(pageOf)} />
                  </div>
                  <PrintField label="Continued on VEO Form Number" value={header.continuedOnForm} />
                  <div style={{ display: "flex", gap: 2, marginTop: 2 }}>
                    <PrintField label="Obs. Date" value={header.obsDate} />
                    <PrintField label="Time Zone" value={header.timeZone} />
                  </div>
                  <div style={{ display: "flex", gap: 2, marginTop: 1 }}>
                    <PrintField label="Start Time" value={header.startTime} />
                    <PrintField label="End Time" value={header.endTime} />
                  </div>
                  <PrintField label="Opacity Limit (%)" value={opacityLimit} />

                  <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 8.5, marginTop: 2 }}>
                    <thead>
                      <tr style={{ background: "#1e293b", color: "#ffffff" }}>
                        <th style={{ border: "1px solid #94a3b8", padding: "0.5px 2px" }}>Min</th>
                        {SEC_COLS.map((s) => (
                          <th key={s} style={{ border: "1px solid #94a3b8", padding: "0.5px 2px" }}>
                            :{String(s).padStart(2, "0")}
                          </th>
                        ))}
                        <th style={{ border: "1px solid #94a3b8", padding: "0.5px 2px" }}>Comments</th>
                      </tr>
                    </thead>
                    <tbody>
                      {rows.slice(pageRowsStart, pageRowsEnd).map((row, i) => {
                        const r = pageRowsStart + i;
                        return (
                          <tr key={r}>
                            <td style={{ border: "1px solid #cbd5e1", textAlign: "center", padding: "0.5px 2px" }}>{i + 1}</td>
                            {row.map((v, c) => (
                              <td key={c} style={{ border: "1px solid #cbd5e1", textAlign: "center", padding: "0.5px 2px" }}>
                                {v}
                              </td>
                            ))}
                            <td style={{ border: "1px solid #cbd5e1", padding: "0.5px 2px" }}>{comments[r]}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>

                  {showSummary && (
                    <div
                      style={{
                        display: "flex",
                        gap: 14,
                        fontSize: 9,
                        marginTop: 3,
                        padding: "1px 4px",
                        border: "1px solid #1e293b",
                      }}
                    >
                      <span>
                        <b>Overall Avg:</b> {overallAverage !== null ? `${overallAverage.toFixed(1)}%` : "–"}
                      </span>
                      <span>
                        <b>Highest 6-min Avg:</b> {highestBlockAvg !== null ? `${highestBlockAvg.toFixed(1)}%` : "–"}
                      </span>
                    </div>
                  )}

                  <div style={{ marginTop: 2, borderTop: "1px solid #94a3b8", paddingTop: 1 }}>
                    <PrintField label="Observer's Name (Print)" value={header.observerName} />
                    <PrintField label="Organization" value={header.organization} />
                    <PrintField label="Observer's Signature" value={header.observerSignature} />
                    <PrintField label="Certified By" value={header.certifiedBy} />
                    <PrintField label="Date" value={header.certifiedDate} />
                  </div>
                </div>
              </div>
            </div>
          );

          return (
            <div className="m9-printdoc" style={{ display: "none" }}>
              {renderPrintPage({
                pageNum: 1,
                pageOf: totalPages,
                pageRowsStart: 0,
                pageRowsEnd: Math.min(30, rows.length),
                showFullDetails: true,
                showSummary: totalPages === 1,
                pageBreak: false,
              })}
              {totalPages > 1 &&
                renderPrintPage({
                  pageNum: 2,
                  pageOf: totalPages,
                  pageRowsStart: 30,
                  pageRowsEnd: rows.length,
                  showFullDetails: false,
                  showSummary: true,
                  pageBreak: true,
                })}
            </div>
          );
        })()}

        <div
          className="text-center text-xs text-slate-400 mt-3 print:hidden"
          style={{ paddingBottom: "env(safe-area-inset-bottom)" }}
        >
          Work is backed up automatically every 2 minutes and restored if you reopen this app.
        </div>
      </div>

      <style>{`
        input, select, textarea, button { font-size: 16px; touch-action: manipulation; }
        table input { font-size: 16px; }
        @media print {
          @page { size: letter portrait; margin: 0.15in; }
          .m9-editform { display: none !important; }
          .m9-printdoc { display: block !important; }
          .m9-printdoc table tr { page-break-inside: avoid; }
        }
      `}</style>
    </div>
  );
}

</script>

<script>
  try {
    if (typeof Babel === "undefined") throw new Error("Babel did not load — see the CDN load message above.");
    if (typeof React === "undefined") throw new Error("React did not load — see the CDN load message above.");
    var source = document.getElementById("app-source").textContent;
    var transformed = Babel.transform(source, { presets: [["react", { runtime: "classic" }]] }).code;
    if (/^\s*(import|export)\b/m.test(transformed)) {
      throw new Error("Babel's output still contains an import/export statement, which new Function() can't run. First 200 chars:\n" + transformed.slice(0, 200));
    }
    var runApp = new Function(
      "React",
      "ReactDOM",
      transformed + "\nReactDOM.createRoot(document.getElementById('root')).render(React.createElement(Method9App));"
    );
    runApp(React, ReactDOM);
  } catch (err) {
    m9ShowError("Build/parse error:", err);
  }
</script>
</body>
</html>
